
name: Refresh and publish Alpine Dashboard

on:
  schedule:
       - cron: '0 5,11,17,23 * * *'
  workflow_dispatch:
    inputs:
      publish_only:
        description: Publish existing data without downloading weather again
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: alpine-daily-refresh
  cancel-in-progress: false

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Correct collector filename
        run: |
          if [ -f 'fetch_snow (1).py' ]; then
            mv -f 'fetch_snow (1).py' fetch_snow.py
          fi

      - name: Fetch snow conditions
        if: ${{ !inputs.publish_only }}
        run: python fetch_snow.py

      - name: Save updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- 'fetch_snow*.py' data.json snow_history.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update Alpine Dashboard"
            git push
          fi

      - name: Prepare website
        run: |
          mkdir -p _site
          cp index.html data.json snow_history.csv _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Wait for website package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' || true)
            if [ -n "$artifact" ]; then
              sleep 10
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
