name: Refresh and publish Alpine Dashboard

on:
  schedule:
    # 06:00 fixed EST (UTC-5) every day = 11:00 UTC.
    # During daylight saving time this runs at 07:00 EDT.
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: alpine-daily-refresh
  cancel-in-progress: false

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch recent snow conditions
        run: python fetch_snow.py

      - name: Commit and push CSV and JSON changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json snow_history.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: update snow conditions $(date -u +%Y-%m-%d)"
            git push
          fi

      # Explicit deployment is necessary: commits made with GITHUB_TOKEN
      # do not themselves trigger a GitHub Pages branch-source rebuild.
      - name: Prepare static website files
        run: |
          mkdir -p _site
          cp index.html data.json snow_history.csv _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
